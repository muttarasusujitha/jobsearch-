  "Glance", "Juspay", "Slice", "Jupiter", "Fi Money", "Khatabook", "smallcase", "Setu", "Cult.fit",
  "Practo", "HealthifyMe", "Ultrahuman", "Ather Energy", "Simpl", "Niyo", "Open Financial",
  "Rupeek", "Jar", "Zeta", "Yellow.ai", "Observe.AI", "Hevo Data", "Exotel", "Whatfix", "Leena AI",
  "Sarvam AI", "Plum", "Acko", "Navi", "FamPay", "Scaler", "Apna", "Jumbotail", "MyGate", "Vymo",
  "Kapture CX", "BrowserStack", "Atlan", "Uniphore", "Fyle", "Zluri", "CleverTap", "Sprinto",
