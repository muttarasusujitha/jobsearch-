# Starter list for the startup finder (python -m jobagent find-startups, or the
# startups service). Add or remove names freely; the city is only a label.
#
# You don't need to know which careers system a company uses: the finder checks
# Greenhouse, Lever and Ashby automatically. Companies that only hire through their
# own website or LinkedIn won't be found here, but their LinkedIn/Naukri jobs are.
#
# The finder also checks every company it sees in Bangalore/Hyderabad job postings,
# so this list is only a starting point.

